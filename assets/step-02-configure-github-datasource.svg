="#c7cbd1" font-family="Arial,sans-serif" font-size="17">The PAT is stored in the</text><text x="790" y="379" fill="#c7cbd1" font-family="Arial,sans-serif" font-size="17">datasource, not the dashboard.</text><text x="790" y="416" fill="#7ee787" font-family="Arial,sans-serif" font-size="17">No write access required</text><rect x="60" y="604" width="500" height="27" rx="13" fill="#1f6feb"/><text x="78" y="623" fill="#fff" font-family="Arial,sans-serif" font-size="15">Use Save &amp; test after entering the token.</text></svg>